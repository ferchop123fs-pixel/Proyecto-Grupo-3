services:
  web:
    build: .
    container_name: tutorias_web
    restart: always
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
    environment:
      - DB_HOST=${DB_HOST:-db}
      - DB_NAME=${DB_NAME:-tutorias_db}
      - DB_USER=${DB_USER:-tutorias_user}
      - DB_PASS=${DB_PASS:-cambiar_esta_clave}
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: tutorias_db
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-cambiar_clave_root}
      MYSQL_DATABASE: ${DB_NAME:-tutorias_db}
      MYSQL_USER: ${DB_USER:-tutorias_user}
      MYSQL_PASSWORD: ${DB_PASS:-cambiar_esta_clave}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: tutorias_phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_USER: ${PMA_USER:-root}
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:-cambiar_clave_root}
    depends_on:
      - db

volumes:
  mysql_data:
